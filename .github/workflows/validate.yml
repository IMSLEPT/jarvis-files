name: Verifica correzioni
on:
  push:
    branches: ['codex/jarvis-files-quality']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilazione e lint
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug 2>&1 | tee build.log || {
            msg=$(grep -E '^e: |error: |What went wrong|Execution failed' build.log | head -50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compilazione::${msg}"
            exit 1
          }
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Regressioni e schermate reali
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/run-tests.sh
      - name: Riepilogo test
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('results/junit/**/*.xml', recursive=True)
          cases = [c for p in paths for c in ET.parse(p).getroot().iter('testcase')]
          failures = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=Test::{len(cases)} test, {len(failures)} falliti')
          for c in failures:
              msg = ''.join(c.itertext())[:1200].replace('\n','%0A')
              print(f'::error title={c.get("name")}::{msg}')
          PYTEST
      - name: Conserva report e screenshot
        if: always()
        run: |
          mkdir -p results
          cp build.log results/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.xml results/ 2>/dev/null || true
          cd results
          git init -q -b "validation-results/${GITHUB_SHA::12}"
          git config user.name jarvis-ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "Verifica ${GITHUB_SHA::12}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-files-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            results/
