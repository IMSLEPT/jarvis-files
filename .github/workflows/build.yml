name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          JARVIS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log || {
            # Errori in un'unica annotazione (leggibile dall'API senza scaricare i log)
            msg=$( (grep -E "^e: " build.log; grep -A6 "What went wrong" build.log) | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compilazione::${msg}"
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JarvisFiles-v1.0.${{ github.run_number }}.apk"
          ls -la dist

      # L'APK si scarica dalle Release (gli asset delle Release non usano la quota storage di Actions).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --title "Jarvis Files v1.0.${{ github.run_number }}" \
            --notes "APK firmato, pronto da installare. Build #${{ github.run_number }} del commit ${GITHUB_SHA::7}."

