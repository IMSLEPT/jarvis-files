name: Test AI reale

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository Hugging Face del modello"
        default: "litert-community/gemma-4-E2B-it-litert-lm"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK di test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Scarica Gemma
        run: |
          mkdir -p model
          REPO="${{ github.event.inputs.repo }}"
          FILE=$(curl -s "https://huggingface.co/api/models/$REPO/tree/main" | python3 -c "
          import json,sys,re
          fs=[f for f in json.load(sys.stdin) if f['path'].endswith('.litertlm') and not re.search('(?i)qualcomm|mediatek|mt6|sm8|npu|web',f['path'])]
          print(min(fs,key=lambda f:len(f['path']))['path'])")
          echo "Modello: $FILE"
          curl -sSL -o "model/$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE?download=true"
          ls -la model

      - name: Esegui i test sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 8192M
          disk-size: 14000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          cores: 4
          emulator-boot-timeout: 1200
          script: ./.github/scripts/run-llm.sh

      - name: Riepilogo come annotazione
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          lines = []
          tot = fail = 0
          for f in glob.glob('results/junit/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  tot += 1
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      fail += 1
                      lines.append(f"FALLITO {tc.get('classname')}.{tc.get('name')}: {(fl.text or '')[:700]}")
          rep = ''
          for p in glob.glob('results/**/report.txt', recursive=True):
              rep = open(p).read()
          msg = f"Test: {tot} eseguiti, {fail} falliti\n" + "\n".join(lines) + "\n--- RAPPORTO ---\n" + rep[:9000]
          if tot == 0:
              msg += "\n--- GRADLE ---\n" + open('results/gradle-tail.txt').read()[-5000:] if os.path.exists('results/gradle-tail.txt') else ''
          print(msg)
          esc = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f"::warning title=Test::{esc}")
          PY

      - name: Pubblica risultati nel branch test-results-llm
        if: always()
        run: |
          cd results
          git init -q -b test-results-llm
          git config user.name "jarvis-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Risultati test ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" test-results-llm
